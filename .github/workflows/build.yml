name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create zip
        run: |
          cd dist-chrome
          find . -name "*.map" -type f -delete
          zip -r ../sitegeist.zip .

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./dist-chrome/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const re = new RegExp('## \\\\[' + version.replace(/\\./g, '\\\\.') + '\\\\][^\\\\n]*\\n(.*?)(?=\\n## \\\\[|$)', 's');
            const match = changelog.match(re);
            let notes = match ? match[1].trim() : '';
            notes += '\n\n---\n\nDownload \`sitegeist.zip\`, unzip, and load as unpacked extension in Chrome/Edge.\n\nSee [installation instructions](https://sitegeist.ai/install.html) for details.';
            fs.writeFileSync('/tmp/release-notes.md', notes);
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        run: |
          TAG_NAME=$(echo "${{ steps.ref.outputs.ref }}" | sed 's|refs/tags/||')
          gh release create "$TAG_NAME" sitegeist.zip \
            --title "Sitegeist ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest || \
          gh release upload "$TAG_NAME" sitegeist.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
