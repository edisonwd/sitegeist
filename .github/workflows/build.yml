name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Prepare release package
        run: |
          # Create a clean release directory
          rm -rf dist-release
          mkdir -p dist-release

          # Copy only production files (exclude dev-only files and source maps)
          cd dist-chrome
          for file in manifest.json app.css background.js sidepanel.js sandbox.js sandbox.html sidepanel.html theme-loader.js cors-rules.json; do
            if [ -f "$file" ]; then
              cp "$file" ../dist-release/
            fi
          done

          # Copy icon files
          for file in icon-*.png; do
            if [ -f "$file" ]; then
              cp "$file" ../dist-release/
            fi
          done

          # Copy pdfjs-dist worker
          if [ -d "pdfjs-dist" ]; then
            cp -r pdfjs-dist ../dist-release/
          fi

          # Remove source maps (should not exist, but just in case)
          find ../dist-release -name "*.map" -type f -delete

          # Remove dev-only files
          rm -f ../dist-release/debug.* ../dist-release/icons.* ../dist-release/test.html

          echo "Release package contents:"
          ls -lh ../dist-release/
          echo "Total size:"
          du -sh ../dist-release/

      - name: Create zip
        run: |
          cd dist-release
          zip -r ../sitegeist.zip .
          cd ..
          echo "Zip file size:"
          ls -lh sitegeist.zip

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./dist-release/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const re = new RegExp('## \\\\[' + version.replace(/\\./g, '\\\\.') + '\\\\][^\\\\n]*\\n(.*?)(?=\\n## \\\\[|$)', 's');
            const match = changelog.match(re);
            let notes = match ? match[1].trim() : '';
            notes += '\n\n---\n\nDownload \`sitegeist.zip\`, unzip, and load as unpacked extension in Chrome/Edge.\n\nSee [installation instructions](https://sitegeist.ai/install.html) for details.';
            fs.writeFileSync('/tmp/release-notes.md', notes);
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} sitegeist.zip \
            --title "Sitegeist ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
